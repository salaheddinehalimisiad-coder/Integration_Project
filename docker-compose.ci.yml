# DataMediator Pro - CI/CD Docker Compose
version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datamediator_backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://mediator_hr:mediator_hr_pwd@postgres_hr:5432/hr_db
      - MYSQL_URL=mysql://mediator_projects:mediator_projects_pwd@mysql_projects:3306/project_db
      - MONGODB_URL=mongodb://datamediator_mongo_finance:27017/finance_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      postgres_hr:
        condition: service_healthy
      mysql_projects:
        condition: service_healthy
      mongo_finance:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datamediator_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - REACT_APP_ENVIRONMENT=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # GraphQL Server
  graphql:
    build:
      context: .
      dockerfile: Dockerfile.graphql
    container_name: datamediator_graphql
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://mediator_hr:mediator_hr_pwd@postgres_hr:5432/hr_db
      - MYSQL_URL=mysql://mediator_projects:mediator_projects_pwd@mysql_projects:3306/project_db
      - MONGODB_URL=mongodb://datamediator_mongo_finance:27017/finance_db
    depends_on:
      postgres_hr:
        condition: service_healthy
      mysql_projects:
        condition: service_healthy
      mongo_finance:
        condition: service_healthy
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/graphql/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL HR Database
  postgres_hr:
    image: postgres:16
    container_name: datamediator_postgres_hr
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: mediator_hr
      POSTGRES_PASSWORD: mediator_hr_pwd
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sources/postgres_hr/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediator_hr -d hr_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MySQL Projects Database
  mysql_projects:
    image: mysql:8.4
    container_name: datamediator_mysql_projects
    environment:
      MYSQL_DATABASE: project_db
      MYSQL_USER: mediator_projects
      MYSQL_PASSWORD: mediator_projects_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sources/mysql_projects/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pwd"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MongoDB Finance Database
  mongo_finance:
    image: mongo:7
    container_name: datamediator_mongo_finance
    environment:
      MONGO_INITDB_DATABASE: finance_db
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./sources/mongo_finance/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: datamediator_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: datamediator_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - datamediator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: datamediator_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - datamediator-network
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: datamediator_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - datamediator-network
    restart: unless-stopped

  # Monitoring - Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: datamediator_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - datamediator-network
    restart: unless-stopped

  # Logs - ELK Stack (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: datamediator_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - datamediator-network
    restart: unless-stopped

  # Logs - ELK Stack (Kibana)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: datamediator_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - datamediator-network
    restart: unless-stopped

  # Logs - ELK Stack (Logstash)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: datamediator_logstash
    ports:
      - "5044:5044"
    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - datamediator-network
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  datamediator-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
